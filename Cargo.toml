[package]
name = "oauth_http_mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
jwks-cache = "0.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# Enable system trust for jwks-cache's Reqwest 0.12 client via feature unification.
reqwest-jwks = { package = "reqwest", version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-stream = "0.1.19"
tower = { version = "0.5.3", features = ["util"] }
